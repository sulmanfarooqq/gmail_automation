<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowVello · Gmail AI Agent</title>
  <link rel="stylesheet" href="/static/brand.css">
</head>
<body>
  <div class="flex">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">⚡ FlowVello</div>
        <div class="sidebar-tagline">Gmail AI Agent</div>
      </div>

      <nav class="sidebar-nav">
        <a href="/" class="sidebar-link {% if active == 'dashboard' %}active{% endif %}">
          <span class="icon">📊</span> Dashboard
        </a>
        <a href="/inbox" class="sidebar-link {% if active == 'inbox' %}active{% endif %}">
          <span class="icon">📬</span> Inbox
        </a>
        <a href="/drafts" class="sidebar-link {% if active == 'drafts' %}active{% endif %}">
          <span class="icon">✏️</span> AI Drafts
          {% if pending_drafts_count > 0 %}
          <span class="sidebar-badge">{{ pending_drafts_count }}</span>
          {% endif %}
        </a>
        <a href="/leads" class="sidebar-link {% if active == 'leads' %}active{% endif %}">
          <span class="icon">🔥</span> Leads
        </a>
        <a href="/followups" class="sidebar-link {% if active == 'followups' %}active{% endif %}">
          <span class="icon">⏰</span> Follow-ups
        </a>

        <hr class="divider" style="border-color:rgba(255,255,255,0.06); margin: 0.75rem 0;">

        <a href="/analytics" class="sidebar-link {% if active == 'analytics' %}active{% endif %}">
          <span class="icon">📈</span> Analytics
        </a>
        <a href="/scan" class="sidebar-link">
          <span class="icon">🔄</span> Scan Now
        </a>
      </nav>

      <div class="sidebar-footer">
        <div style="display:flex; align-items:center; gap:0.5rem;">
          <span class="status-dot {% if gmail_status == 'Connected' %}connected{% else %}disconnected{% endif %}"></span>
          <span style="color:var(--sidebar-text);">{{ gmail_status }}</span>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1" style="min-height:100vh;">
      <div class="p-6 fade-in">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
</body>
</html>
